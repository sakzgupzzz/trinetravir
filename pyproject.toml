[project]
name = "trinetravir"
version = "0.0.1"
description = "Cross-virus transfer learning for single-cell host response prediction."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Saksham Gupta", email = "gsaksham@gmail.com" }]
requires-python = ">=3.11,<3.12"
keywords = ["single-cell", "scRNA-seq", "transfer-learning", "virology", "perturbation-prediction"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Single-cell core
    "scanpy>=1.10",
    "anndata>=0.10",
    "scvi-tools>=1.2",
    # ML stack (CPU-only on laptop; same wheels carry MPS on arm64-darwin)
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "scikit-learn>=1.4",
    # Data + numerics
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "scipy>=1.12",
    # Config + experiment tracking
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "wandb>=0.17",
    # Notebook ergonomics
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "cellxgene-census>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/sakzgupzzz/trinetravir"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trinetravir"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM"]
ignore = [
    "E501",  # black handles line length
    "N806",  # X / var / obs are scanpy/AnnData convention
    "N803",  # same reasoning for function args (X passed to fit() etc)
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # most scientific deps lack stubs
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "nbclient>=0.10.4",
    "nbconvert>=7.17.1",
]
